<html lang="en">
<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #f5f0e8;
    --black: #0a0a0a;
    --accent: #e8ff3a;
    --dim: rgba(245,240,232,0.55);
    --glass: rgba(10,10,10,0.65);
    --glass-border: rgba(245,240,232,0.12);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Space Mono', monospace;
    cursor: none;
  }

  #cursor {
    position: fixed; top: 0; left: 0; z-index: 9999;
    pointer-events: none;
    mix-blend-mode: difference;
  }
  #cursor-dot {
    position: absolute;
    width: 8px; height: 8px;
    background: var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s;
  }
  #cursor-ring {
    position: absolute;
    width: 36px; height: 36px;
    border: 1.5px solid var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s linear, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.7;
  }
  body.hovered #cursor-dot { width: 14px; height: 14px; }
  body.hovered #cursor-ring { width: 50px; height: 50px; opacity: 0.3; }

  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: block;
  }

  .noise {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(2px);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 14vw, 160px);
    letter-spacing: 0.04em;
    line-height: 0.85;
    color: var(--white);
    text-align: center;
  }
  #gate-sub {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--dim);
    text-transform: uppercase;
    animation: blink 1.4s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  #main {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease 0.3s;
  }
  #main.visible { opacity: 1; pointer-events: auto; }

  .name-block {
    text-align: center;
    line-height: 1;
    margin-bottom: 8px;
    transform: translateY(20px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.5s, opacity 0.7s ease 0.5s;
    opacity: 0;
  }
  #main.visible .name-block { transform: translateY(0); opacity: 1; }

  .name-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 16vw, 180px);
    letter-spacing: 0.02em;
    color: var(--white);
    display: block;
  }
  .name-text span {
    display: inline-block;
    transition: color 0.2s, transform 0.2s;
  }
  .name-text span:hover { color: var(--accent); transform: translateY(-4px) scaleY(1.06); }

  .role {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 6px;
    transform: translateY(10px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.65s, opacity 0.7s ease 0.65s;
    opacity: 0;
  }
  #main.visible .role { transform: translateY(0); opacity: 1; }

  .links {
    display: flex; gap: 28px;
    margin-top: 36px;
    transform: translateY(10px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.8s, opacity 0.7s ease 0.8s;
    opacity: 0;
  }
  #main.visible .links { transform: translateY(0); opacity: 1; }

  .links a {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.2s;
  }
  .links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 0; height: 1px;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .links a:hover { color: var(--white); }
  .links a:hover::after { width: 100%; }

  #player {
    position: fixed;
    bottom: 28px; left: 28px;
    z-index: 60;
    width: 280px;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease 1s, transform 0.6s ease 1s;
  }
  #player.visible { opacity: 1; transform: translateY(0); }

  .player-top {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 12px;
  }
  .album-art {
    width: 46px; height: 46px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1a1a1a;
  }
  .player-meta { overflow: hidden; flex: 1; }
  .song-name {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--white);
    letter-spacing: 0.02em;
  }
  .player-status {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  #progress-track {
    width: 100%; height: 3px;
    background: rgba(245,240,232,0.12);
    border-radius: 2px;
    cursor: pointer;
    margin-bottom: 12px;
    position: relative;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
  }
  #progress-thumb {
    position: absolute;
    top: 50%; right: auto;
    width: 9px; height: 9px;
    background: var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    left: 0%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #progress-track:hover #progress-thumb { opacity: 1; }

  .time-row {
    display: flex; justify-content: space-between;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-top: -8px;
    margin-bottom: 10px;
  }

  .player-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 20px;
  }
  .ctrl-btn {
    background: none; border: none;
    color: var(--dim);
    cursor: none;
    font-size: 18px;
    line-height: 1;
    display: flex; align-items: center;
    transition: color 0.15s, transform 0.15s;
    padding: 4px;
  }
  .ctrl-btn:hover { color: var(--white); transform: scale(1.15); }
  .ctrl-btn.play-btn {
    width: 38px; height: 38px;
    background: var(--white);
    color: var(--black);
    border-radius: 50%;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn.play-btn:hover { background: var(--accent); transform: scale(1.08); }

  .icon { display: block; fill: currentColor; }

  #corner-tag {
    position: fixed; bottom: 28px; right: 28px;
    z-index: 60;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: rgba(245,240,232,0.25);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    opacity: 0;
    transition: opacity 0.6s ease 1.2s;
  }
  #corner-tag.visible { opacity: 1; }

  a, button, [role="button"] { cursor: none; }
</style>

<script>

const cursorRing = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function animCursor() {
  cursorDot.style.left = mx + 'px';
  cursorDot.style.top = my + 'px';
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  cursorRing.style.left = rx + 'px';
  cursorRing.style.top = ry + 'px';
  requestAnimationFrame(animCursor);
}
animCursor();

const letters = 'aiola';

const mainEl = document.getElementById('main');

(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let W, H, mouse = { x: -9999, y: -9999 };
  let nodes = [], frame = 0;

  const NODE_COUNT = 110;
  const MAX_DIST = 160;
  const MOUSE_REPEL = 120;
  const REPEL_STRENGTH = 2.2;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeNode(i) {
    const type = i < 12 ? 'orbit' : i < 30 ? 'fast' : 'drift';
    return {
      x: rand(0, W), y: rand(0, H),
      vx: rand(-0.18, 0.18), vy: rand(-0.18, 0.18),
      ox: 0, oy: 0,
      r: rand(1.2, type === 'orbit' ? 3.2 : 2.0),
      baseAlpha: rand(0.18, type === 'fast' ? 0.55 : 0.38),
      alpha: 0,
      pulse: rand(0, Math.PI * 2),
      pulseSpeed: rand(0.004, 0.014),
      type,
      angle: rand(0, Math.PI * 2),
      orbitR: rand(60, 200),
      orbitSpeed: rand(0.0003, 0.0009) * (Math.random() > 0.5 ? 1 : -1),
      cx: rand(0, W), cy: rand(0, H),
    };
  }

  function init() {
    resize();
    nodes = Array.from({ length: NODE_COUNT }, (_, i) => makeNode(i));
  }

  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener('resize', () => { resize(); });

  const ripples = [];
  document.addEventListener('click', e => {
    if (document.getElementById('gate').classList.contains('hidden')) {
      ripples.push({ x: e.clientX, y: e.clientY, r: 0, maxR: 220, alpha: 0.22, dead: false });
    }
  });

  function drawRipples() {
    ripples.forEach(rip => {
      rip.r += 4.5;
      rip.alpha *= 0.93;
      if (rip.r > rip.maxR || rip.alpha < 0.005) { rip.dead = true; return; }
      ctx.beginPath();
      ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(180,180,180,${rip.alpha})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });
    for (let i = ripples.length - 1; i >= 0; i--) {
      if (ripples[i].dead) ripples.splice(i, 1);
    }
  }

  function drawGrid() {
    const spacing = 80;
    ctx.lineWidth = 0.3;
    const t = frame * 0.0004;
    for (let x = 0; x < W; x += spacing) {
      const shift = Math.sin(t + x * 0.01) * 6;
      ctx.beginPath();
      ctx.moveTo(x + shift, 0);
      ctx.lineTo(x - shift, H);
      ctx.strokeStyle = `rgba(80,80,80,0.07)`;
      ctx.stroke();
    }
    for (let y = 0; y < H; y += spacing) {
      const shift = Math.cos(t + y * 0.01) * 6;
      ctx.beginPath();
      ctx.moveTo(0, y + shift);
      ctx.lineTo(W, y - shift);
      ctx.strokeStyle = `rgba(80,80,80,0.07)`;
      ctx.stroke();
    }
  }

  const dust = Array.from({ length: 60 }, () => ({
    x: Math.random() * 1920, y: Math.random() * 1080,
    s: Math.random() * 0.5 + 0.2,
    a: Math.random() * 0.18 + 0.04,
    vx: (Math.random() - 0.5) * 0.06,
    vy: -Math.random() * 0.08 - 0.02,
  }));

  function drawDust() {
    dust.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
      if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.s, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,200,200,${d.a})`;
      ctx.fill();
    });
  }

  function tick() {
    frame++;
    ctx.clearRect(0, 0, W, H);

    const vg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(22,22,22,1)');
    vg.addColorStop(1, 'rgba(4,4,4,1)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    drawGrid();

    nodes.forEach(n => {
      n.pulse += n.pulseSpeed;
      const pulsed = Math.sin(n.pulse) * 0.5 + 0.5;

      if (n.type === 'orbit') {
        n.angle += n.orbitSpeed;
        n.x = n.cx + Math.cos(n.angle) * n.orbitR;
        n.y = n.cy + Math.sin(n.angle) * n.orbitR;
        n.cx += n.vx * 0.3; n.cy += n.vy * 0.3;
        if (n.cx < 0) n.cx = W; if (n.cx > W) n.cx = 0;
        if (n.cy < 0) n.cy = H; if (n.cy > H) n.cy = 0;
      } else {
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_REPEL) {
          const force = (MOUSE_REPEL - dist) / MOUSE_REPEL;
          n.vx += (dx / dist) * force * REPEL_STRENGTH * 0.08;
          n.vy += (dy / dist) * force * REPEL_STRENGTH * 0.08;
        }
        n.vx *= 0.97; n.vy *= 0.97;
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0) n.x = W; if (n.x > W) n.x = 0;
        if (n.y < 0) n.y = H; if (n.y > H) n.y = 0;
      }

      n.alpha = n.baseAlpha * (0.6 + pulsed * 0.4);
    });

    ctx.lineWidth = 0.5;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < MAX_DIST) {
          const t = 1 - d / MAX_DIST;
          const mx2 = (a.x + b.x) / 2, my2 = (a.y + b.y) / 2;
          const mdist = Math.sqrt((mx2 - mouse.x) ** 2 + (my2 - mouse.y) ** 2);
          const boost = mdist < 200 ? (1 - mdist / 200) * 0.5 : 0;
          const alpha = t * 0.22 + boost * 0.3;
          const grey = Math.floor(120 + t * 60);
          ctx.strokeStyle = `rgba(${grey},${grey},${grey},${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, MOUSE_REPEL * 1.8);
    mg.addColorStop(0, 'rgba(140,140,140,0.04)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, W, H);

    nodes.forEach(n => {
      const isnear = Math.sqrt((n.x - mouse.x) ** 2 + (n.y - mouse.y) ** 2) < MOUSE_REPEL;
      const glowR = n.r * (isnear ? 2.5 : 1.8);
      const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
      const grey = isnear ? 220 : 160;
      grd.addColorStop(0, `rgba(${grey},${grey},${grey},${n.alpha * (isnear ? 1.5 : 1)})`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(n.x, n.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * (isnear ? 1.4 : 1), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${grey},${grey},${grey},${Math.min(n.alpha * 2, 0.9)})`;
      ctx.fill();
    });

    drawDust();
    drawRipples();

    requestAnimationFrame(tick);
  }

  init();
  tick();
})();

const audio = document.getElementById('audio');

let currentIndex = 0;
let isPlaying = false;

const playPath = 'M8 5v14l11-7z';
const pausePath = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function fmt(s) {
  if (!s || isNaN(s)) return '--:--';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function playSong(idx) {
  currentIndex = idx;
  const song = playlist[idx];
  audio.src = song.src;
  songNameEl.textContent = song.name;
  albumArtEl.src = song.cover;
  albumArtEl.style.animation = 'none';
  void albumArtEl.offsetWidth;
  audio.play().then(() => {
    isPlaying = true;
    playIcon.querySelector('path') ? playIcon.innerHTML = '<path d="' + pausePath + '"/>' : null;
    playIcon.innerHTML = '<path d="' + pausePath + '"/>';
    playerStatus.textContent = 'playing';
  }).catch(() => {});
}

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = '<path d="' + playPath + '"/>';
    playerStatus.textContent = 'paused';
  } else {
    audio.play();
    isPlaying = true;
    playIcon.innerHTML = '<path d="' + pausePath + '"/>';
    playerStatus.textContent = 'playing';
  }
}

btnPlay.addEventListener('click', () => {
  if (!audio.src || audio.src === window.location.href) { playSong(currentIndex); return; }
  togglePlay();
});
btnPrev.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playSong(currentIndex);
});
btnNext.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  playSong(currentIndex);
});

audio.addEventListener('ended', () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  playSong(currentIndex);
});

audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  timeCurrent.textContent = fmt(audio.currentTime);
  timeTotal.textContent = fmt(audio.duration);
});

progressTrack.addEventListener('click', e => {
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

songNameEl.textContent = playlist[0].name;
albumArtEl.src = playlist[0].cover;
</script>
</body>
</html>
