<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiola</title>
<link rel="icon" href="./assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #f5f0e8;
    --black: #0a0a0a;
    --accent: #e8ff3a;
    --dim: rgba(245,240,232,0.55);
    --glass: rgba(10,10,10,0.65);
    --glass-border: rgba(245,240,232,0.12);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Space Mono', monospace;
    cursor: none;
  }

  /* --- CUSTOM CURSOR --- */
  #cursor {
    position: fixed; top: 0; left: 0; z-index: 9999;
    pointer-events: none;
    mix-blend-mode: difference;
  }
  #cursor-dot {
    position: absolute;
    width: 8px; height: 8px;
    background: var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s;
  }
  #cursor-ring {
    position: absolute;
    width: 36px; height: 36px;
    border: 1.5px solid var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s linear, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.7;
  }
  body.hovered #cursor-dot { width: 14px; height: 14px; }
  body.hovered #cursor-ring { width: 50px; height: 50px; opacity: 0.3; }

  /* --- VIDEO BG --- */
  .vid-bg {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.28) saturate(0.6);
    pointer-events: none;
  }

  /* --- NOISE OVERLAY --- */
  .noise {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  /* --- SCANLINES --- */
  .scanlines {
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  /* --- CLICK GATE --- */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(2px);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 14vw, 160px);
    letter-spacing: 0.04em;
    line-height: 0.85;
    color: var(--white);
    text-align: center;
  }
  #gate-sub {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--dim);
    text-transform: uppercase;
    animation: blink 1.4s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* --- MAIN CONTENT --- */
  #main {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease 0.3s;
  }
  #main.visible { opacity: 1; pointer-events: auto; }

  .name-block {
    text-align: center;
    line-height: 1;
    margin-bottom: 8px;
    transform: translateY(20px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.5s, opacity 0.7s ease 0.5s;
    opacity: 0;
  }
  #main.visible .name-block { transform: translateY(0); opacity: 1; }

  .name-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 16vw, 180px);
    letter-spacing: 0.02em;
    color: var(--white);
    display: block;
  }
  .name-text span {
    display: inline-block;
    transition: color 0.2s, transform 0.2s;
  }
  .name-text span:hover { color: var(--accent); transform: translateY(-4px) scaleY(1.06); }

  .role {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 6px;
    transform: translateY(10px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.65s, opacity 0.7s ease 0.65s;
    opacity: 0;
  }
  #main.visible .role { transform: translateY(0); opacity: 1; }

  /* --- LINKS --- */
  .links {
    display: flex; gap: 28px;
    margin-top: 36px;
    transform: translateY(10px);
    transition: transform 0.7s cubic-bezier(0.2,1,0.3,1) 0.8s, opacity 0.7s ease 0.8s;
    opacity: 0;
  }
  #main.visible .links { transform: translateY(0); opacity: 1; }

  .links a {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.2s;
  }
  .links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 0; height: 1px;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .links a:hover { color: var(--white); }
  .links a:hover::after { width: 100%; }

  /* --- MUSIC PLAYER --- */
  #player {
    position: fixed;
    bottom: 28px; left: 28px;
    z-index: 60;
    width: 280px;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.6s ease 1s, transform 0.6s ease 1s;
  }
  #player.visible { opacity: 1; transform: translateY(0); }

  .player-top {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 12px;
  }
  .album-art {
    width: 46px; height: 46px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1a1a1a;
  }
  .player-meta { overflow: hidden; flex: 1; }
  .song-name {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--white);
    letter-spacing: 0.02em;
  }
  .player-status {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Progress */
  #progress-track {
    width: 100%; height: 3px;
    background: rgba(245,240,232,0.12);
    border-radius: 2px;
    cursor: pointer;
    margin-bottom: 12px;
    position: relative;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
  }
  #progress-thumb {
    position: absolute;
    top: 50%; right: auto;
    width: 9px; height: 9px;
    background: var(--white);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    left: 0%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #progress-track:hover #progress-thumb { opacity: 1; }

  /* Time */
  .time-row {
    display: flex; justify-content: space-between;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-top: -8px;
    margin-bottom: 10px;
  }

  /* Controls */
  .player-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 20px;
  }
  .ctrl-btn {
    background: none; border: none;
    color: var(--dim);
    cursor: none;
    font-size: 18px;
    line-height: 1;
    display: flex; align-items: center;
    transition: color 0.15s, transform 0.15s;
    padding: 4px;
  }
  .ctrl-btn:hover { color: var(--white); transform: scale(1.15); }
  .ctrl-btn.play-btn {
    width: 38px; height: 38px;
    background: var(--white);
    color: var(--black);
    border-radius: 50%;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn.play-btn:hover { background: var(--accent); transform: scale(1.08); }

  /* SVG icons */
  .icon { display: block; fill: currentColor; }

  /* --- CORNER TAG --- */
  #corner-tag {
    position: fixed; bottom: 28px; right: 28px;
    z-index: 60;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: rgba(245,240,232,0.25);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    opacity: 0;
    transition: opacity 0.6s ease 1.2s;
  }
  #corner-tag.visible { opacity: 1; }

  /* Hover cursor expand trigger */
  a, button, [role="button"] { cursor: none; }
</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor">
  <div id="cursor-ring"></div>
  <div id="cursor-dot"></div>
</div>

<!-- Background video -->
<video class="vid-bg" id="bgvid" loop muted playsinline preload="auto">
  <source src="https://vouched.gg/images/aiolalolvid.mp4" type="video/mp4">
</video>

<!-- Overlays -->
<div class="noise"></div>
<div class="scanlines"></div>

<!-- Click gate -->
<div id="gate">
  <div id="gate-title">aiola</div>
  <div id="gate-sub">[ click anywhere to enter ]</div>
</div>

<!-- Main content -->
<div id="main">
  <div class="name-block">
    <span class="name-text" id="name-letters"></span>
  </div>
  <div class="role">software engineer</div>
  <div class="links">
    <a href="https://discordapp.com/users/1169060950473719888" target="_blank" rel="noopener">discord</a>
    <a href="mailto:admin@aiola.lol">email</a>
    <a href="https://t.me/aiolas" target="_blank" rel="noopener">telegram</a>
    <a href="https://github.com/Ai0la" target="_blank" rel="noopener">github</a>
  </div>
</div>

<!-- Music player -->
<div id="player">
  <div class="player-top">
    <img class="album-art" id="album-art" src="./assets/song1.png" alt="Album cover">
    <div class="player-meta">
      <div class="song-name" id="song-name">4am</div>
      <div class="player-status" id="player-status">paused</div>
    </div>
  </div>

  <div id="progress-track">
    <div id="progress-fill"></div>
    <div id="progress-thumb"></div>
  </div>
  <div class="time-row">
    <span id="time-current">0:00</span>
    <span id="time-total">--:--</span>
  </div>

  <div class="player-controls">
    <!-- Prev -->
    <button class="ctrl-btn" id="btn-prev" aria-label="Previous">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24">
        <path d="M19 20L9 12l10-8v16zM5 4h2v16H5z"/>
      </svg>
    </button>
    <!-- Play/Pause -->
    <button class="ctrl-btn play-btn" id="btn-play" aria-label="Play">
      <svg class="icon" id="play-icon" width="14" height="14" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <!-- Next -->
    <button class="ctrl-btn" id="btn-next" aria-label="Next">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24">
        <path d="M5 4l10 8-10 8V4zm14 0h-2v16h2z"/>
      </svg>
    </button>
  </div>
</div>

<!-- Corner tag -->
<div id="corner-tag" role="presentation">aiola.lol / 2025</div>

<audio id="audio" preload="auto"></audio>

<script>
// --- Cursor ---
const cursorDot = document.getElementById('cursor-dot');
const cursorRing = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function animCursor() {
  cursorDot.style.left = mx + 'px';
  cursorDot.style.top = my + 'px';
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  cursorRing.style.left = rx + 'px';
  cursorRing.style.top = ry + 'px';
  requestAnimationFrame(animCursor);
}
animCursor();
document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('hovered'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('hovered'));
});

// --- Name letters ---
const letters = 'aiola';
const nameEl = document.getElementById('name-letters');
letters.split('').forEach((c, i) => {
  const s = document.createElement('span');
  s.textContent = c;
  s.style.transitionDelay = (0.05 * i + 0.5) + 's';
  nameEl.appendChild(s);
});

// --- Gate ---
const gate = document.getElementById('gate');
const mainEl = document.getElementById('main');
const player = document.getElementById('player');
const cornerTag = document.getElementById('corner-tag');
const bgvid = document.getElementById('bgvid');

gate.addEventListener('click', enter);
function enter() {
  gate.classList.add('hidden');
  bgvid.play().catch(() => {});
  mainEl.classList.add('visible');
  player.classList.add('visible');
  cornerTag.classList.add('visible');
  // auto-start first song
  setTimeout(() => playSong(0), 400);
}

// --- Player ---
const audio = document.getElementById('audio');
const songNameEl = document.getElementById('song-name');
const albumArtEl = document.getElementById('album-art');
const playerStatus = document.getElementById('player-status');
const progressFill = document.getElementById('progress-fill');
const progressThumb = document.getElementById('progress-thumb');
const progressTrack = document.getElementById('progress-track');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const btnPlay = document.getElementById('btn-play');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const playIcon = document.getElementById('play-icon');

const playlist = [
  { name: '4am',          src: './assets/song1.mp3', cover: './assets/song1.png' },
  { name: 'Space Cowboy', src: './assets/song2.mp3', cover: './assets/song2.png' },
  { name: 'Just for Now', src: './assets/song6.mp3', cover: './assets/song6.png' },
  { name: '3am (Freestyle)', src: './assets/song7.mp3', cover: './assets/song7.png' },
];

let currentIndex = 0;
let isPlaying = false;

const playPath = 'M8 5v14l11-7z';
const pausePath = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function fmt(s) {
  if (!s || isNaN(s)) return '--:--';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function playSong(idx) {
  currentIndex = idx;
  const song = playlist[idx];
  audio.src = song.src;
  songNameEl.textContent = song.name;
  albumArtEl.src = song.cover;
  albumArtEl.style.animation = 'none';
  void albumArtEl.offsetWidth;
  audio.play().then(() => {
    isPlaying = true;
    playIcon.querySelector('path') ? playIcon.innerHTML = '<path d="' + pausePath + '"/>' : null;
    playIcon.innerHTML = '<path d="' + pausePath + '"/>';
    playerStatus.textContent = 'playing';
  }).catch(() => {});
}

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = '<path d="' + playPath + '"/>';
    playerStatus.textContent = 'paused';
  } else {
    audio.play();
    isPlaying = true;
    playIcon.innerHTML = '<path d="' + pausePath + '"/>';
    playerStatus.textContent = 'playing';
  }
}

btnPlay.addEventListener('click', () => {
  if (!audio.src || audio.src === window.location.href) { playSong(currentIndex); return; }
  togglePlay();
});
btnPrev.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playSong(currentIndex);
});
btnNext.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  playSong(currentIndex);
});

audio.addEventListener('ended', () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  playSong(currentIndex);
});

audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  timeCurrent.textContent = fmt(audio.currentTime);
  timeTotal.textContent = fmt(audio.duration);
});

progressTrack.addEventListener('click', e => {
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// Init song name
songNameEl.textContent = playlist[0].name;
albumArtEl.src = playlist[0].cover;
</script>
</body>
</html>
